# ============================================================
# 학생 개별 관찰 누적 프로필
# 파일명: {이름 또는 익명코드}.yaml
# ============================================================
# 이 파일은 여러 세션에 걸쳐 점진적으로 채워지는 관찰 자료다.
# 단정적 판단이 아니라, 관찰 → 패턴 → 잠정 이해의 흐름을 기록한다.
# ============================================================

id: ""                     # 이름 또는 익명 코드
grade: ""                  # 학년
first_observed: "YYYY-MM-DD"
last_updated: "YYYY-MM-DD"

# ── 이해/학습 패턴 ───────────────────────────────────────────

learning:
  strengths: []            # 잘 받아들이는 방식, 빠르게 이해하는 영역
  recurring_blocks: []     # 반복적으로 막히거나 저항하는 주제/개념
  responds_to: []          # 잘 반응하는 전달 방식 (질문형/이야기/직접 설명 등)

# ── 정서/심리 패턴 ───────────────────────────────────────────

emotional:
  current_pressures: []    # 현재 처한 압박 (학업/관계/가정 등)
  baseline_state: ""       # 평소 정서 기저 (활발/조용/방어적/개방적 등)
  triggers: []             # 특정 반응을 유발하는 상황/주제

# ── 관계 맥락 ────────────────────────────────────────────────

relational:
  position_in_group: ""    # 소그룹 내 위치 (리더형/중간/외곽/관찰자 등)
  close_with: []           # 친한 학생
  tensions_with: []        # 긴장 관계
  relation_with_me: ""     # 나와의 관계 온도

# ── 신앙/영적 흐름 ───────────────────────────────────────────

spiritual:
  current_stage: ""        # 현재 신앙 단계 (탐색/기초/성장/주도 등)
  open_topics: []          # 열려 있는 주제
  closed_topics: []        # 닫혀 있거나 저항하는 주제

# ── 세션별 관찰 기록 (간략) ──────────────────────────────────

session_notes:
  - date: "YYYY-MM-DD"
    summary: ""            # 이 학생에 대해 이 날 관찰한 핵심 한 줄
    follow_up: ""          # 다음에 챙길 것

# ── 다음 개입 방향 ───────────────────────────────────────────

next_approach:
  intention: ""            # 이 학생에게 지금 가장 필요한 것
  method: ""               # 공개적 vs 개인적, 질문형 vs 이야기형 등
  timing: ""               # 지금 / 시험 후 / 관계가 더 쌓인 후 등
