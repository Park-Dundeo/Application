# ============================================================
# 교사 자기 성찰 누적 (Self Reflection)
# ============================================================
# 내가 어떤 교사인지를 기록하고 발전시키는 파일.
# 세션 기록의 self_reflection이 여기로 누적된다.
# ============================================================

last_updated: "YYYY-MM-DD"

# ── 말투 & 전달 방식 ─────────────────────────────────────────

communication_style:
  strengths: []            # 반복적으로 효과 있었던 방식
  weaknesses: []           # 반복적으로 효과 없었던 방식
  default_patterns: []     # 의식하지 않으면 나오는 습관적 패턴

# ── 의도 vs 실제 전달 간극 ──────────────────────────────────

intent_gap_patterns:
  - intended: ""           # 내가 의도한 것
    actual: ""             # 실제로 받아들여진 것
    frequency: ""          # 얼마나 반복되는가
    adjustment: ""         # 어떻게 바꿔야 하는가

# ── 강점 ─────────────────────────────────────────────────────

strengths:
  - area: ""
    evidence: []           # 어떤 장면에서 확인됐는가

# ── 한계 & 성장 과제 ─────────────────────────────────────────

growth_areas:
  - area: ""
    pattern: ""            # 어떤 상황에서 한계가 드러나는가
    working_on: ""         # 현재 시도 중인 개선 방법

# ── 역할 경계 성찰 ───────────────────────────────────────────

role_boundaries:
  tendency: ""             # 내가 자주 넘거나 부족한 경계
  notes: ""

# ── 분기별 성장 기록 ─────────────────────────────────────────

quarterly_reflection:
  - period: ""             # 예: 2026년 1분기
    how_i_changed: ""      # 이 기간 나는 어떤 교사로 자랐는가
    key_lesson: ""         # 가장 중요한 배움 한 줄
    next_focus: ""         # 다음 분기 집중할 것
