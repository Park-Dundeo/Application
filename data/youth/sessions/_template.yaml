# ============================================================
# 소그룹 세션 기록 템플릿
# 파일명: YYYY-MM-DD.yaml (세션 날짜)
# ============================================================
# 작성 원칙:
#   - facts(사실)와 interpretation(해석)을 반드시 분리
#   - 기록의 완성은 저장이 아니라 next_connection(연결)
# ============================================================

date: "YYYY-MM-DD"
session_number: 0          # 누적 회차
topic: ""                  # 이번 소그룹 주제/교재 단원
participants: []           # 출석 학생 이름 (익명화 가능)
context: ""                # 시기적 맥락 (시험 직전, 수련회 이후, 고3 압박 등)

# ── 사실 영역 (있었던 일) ───────────────────────────────────

facts:
  events:                  # 세션 중 일어난 사건/장면
    - ""
  conversations:           # 기억할 대화 (가능한 원문 그대로)
    - who: ""
      what: ""
  atmosphere: ""           # 전반적 분위기 (활기/침묵/산만/집중 등)

# ── 관찰 (반응) ──────────────────────────────────────────────

observations:
  understanding:           # 이해한 것 / 막힌 것
    got: []
    stuck: []
  emotional:               # 정서 반응 (각 학생별 또는 전체)
    - who: ""
      state: ""
  relational:              # 공동체 안 관계 흐름 (갈등, 친밀, 소외 등)
    - ""
  notable:                 # 특별히 눈에 띄었던 순간
    - ""

# ── 해석 (왜 그랬는가) ──────────────────────────────────────

interpretation:
  - observation: ""        # 어떤 반응/사건에 대한 해석
    reading: ""            # 내 해석/이해

# ── 가설 (다음에 시도할 것) ─────────────────────────────────

hypothesis:
  - if: ""                 # 이렇게 해보면
    then: ""               # 이런 반응이 나올 것 같다

# ── 나 자신 성찰 ─────────────────────────────────────────────

self_reflection:
  what_i_said: ""          # 내가 사용한 방식/어투 요약
  intended: ""             # 내 의도
  actual_effect: ""        # 실제로 어떻게 받아들여진 것 같은가
  worked: []               # 효과 있었던 것
  didnt_work: []           # 효과 없었던 것

# ── 다음 연결 ────────────────────────────────────────────────

next_connection:
  questions_to_ask:        # 다음에 던질 질문
    - ""
  who_to_follow_up:        # 따로 챙길 학생
    - who: ""
      why: ""
  content_to_revisit:      # 다시 다뤄야 할 내용
    - ""
  curriculum_adjustment:   # 교재/설명 방식 보완 사항
    - ""
  relationships_to_repair: # 회복/강화할 관계
    - ""

# ── 패턴 태그 (누적 분석용) ──────────────────────────────────

tags:
  student_types: []        # 이번에 보인 학생 유형 패턴
  themes: []               # 반복 등장하는 주제/질문
  intervention_type: ""    # 공개적 개입 / 개인적 개입 / 혼합
