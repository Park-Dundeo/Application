# ============================================================
# 누적 인사이트 & 패턴 (Accumulated Insights)
# ============================================================
# 여러 세션에 걸쳐 반복 확인된 원리를 축적하는 파일.
# 가설이 현장에서 검증되면 여기로 올라온다.
# 최종 목표: 현장 검증된 청소년 사역 운영 원리
# ============================================================

last_updated: "YYYY-MM-DD"

# ── 주제별 설명 원리 ─────────────────────────────────────────
# "이 주제는 이렇게 설명할 때 잘 들어간다"

topic_principles:
  - topic: ""
    works: ""              # 효과적인 설명/질문 방식
    doesnt_work: ""        # 반복적으로 막히는 방식
    notes: ""

# ── 학생 유형별 개입 원리 ────────────────────────────────────

student_type_patterns:
  - type: ""               # 유형 이름 (예: 방어적-조용형, 리더-과시형 등)
    characteristics: []
    effective_approach: ""
    timing: ""             # 언제 개입하면 좋은가

# ── 전달 방식 원리 ───────────────────────────────────────────

delivery_principles:
  - context: ""            # 어떤 상황에서
    method: ""             # 어떤 방식이
    effect: ""             # 어떤 효과를 냈는가
    verified_count: 0      # 몇 번 확인됐는가

# ── 관계 형성/교정 타이밍 ────────────────────────────────────

relational_timing:
  - situation: ""
    right_timing: ""
    wrong_timing: ""
    notes: ""

# ── 공개적 개입 vs 개인적 개입 ──────────────────────────────

intervention_patterns:
  public_works_when: []    # 공개 개입이 효과적인 조건
  private_works_when: []   # 개인 개입이 효과적인 조건

# ── 자주 막히는 주제 ─────────────────────────────────────────

recurring_blocks:
  - topic: ""
    pattern: ""            # 어떻게 막히는가
    tried: []              # 시도해본 것
    hypothesis: ""         # 다음에 시도할 것

# ── 시기적 변수 패턴 ─────────────────────────────────────────

seasonal_patterns:
  - period: ""             # 시험 전, 방학 직후, 수련회 이후 등
    typical_state: ""      # 이 시기 학생들의 전형적 상태
    recommended_approach: ""

# ── 검증 대기 가설 ───────────────────────────────────────────
# sessions에서 올라온 가설 중 아직 검증되지 않은 것들

pending_hypotheses:
  - hypothesis: ""
    from_session: "YYYY-MM-DD"
    status: "미검증"       # 미검증 / 부분확인 / 기각
    next_test: ""
